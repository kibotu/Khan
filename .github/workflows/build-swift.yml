name: Swift

on: [push, pull_request]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      matrix:
        # macos-14 ships Swift 5.10 (minimum supported), macos-latest the current toolchain
        os: [macos-14, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test

  ios:
    name: Build for iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild build -scheme Khan -destination 'generic/platform=iOS' -quiet
